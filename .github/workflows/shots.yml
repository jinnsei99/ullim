# 울림 스튜디오 화면 촬영 (ROADMAP 0-16 · 0-17): 디자인 A·B·C × 컴퓨터 · 아이패드 버전 6장 + 좁은 화면 1장을 어두운 화면 · 밝은 화면으로 한 벌씩(14장) 헤드리스 크롬으로 찍는다.
# 점검(check.yml)과 배포(pages.yml)와는 따로 돈다. 그림은 이 실행 화면 아래 Artifacts에 zip으로 올라간다(받으려면 로그인).
# PR마다 PR의 마지막 커밋을 찍고, Actions 탭에서 손으로 실행하면 고른 브랜치를 찍는다. 찍는 법은 .github/shots/shoot.mjs 맨 위.
# 전후 비교 (ROADMAP 0-18): 같은 실행 · 같은 크롬 · 같은 촬영 코드로 main과 갈라진 지점(merge-base)의 앱 파일도 찍고(_shots/before/),
# 이름끼리 대 봐서 달라진 그림 목록과 전 | 후 | 차이 그림(_shots/compare/)을 낸다. 달라져도 빨강이 아니다. 비교하는 법은 .github/shots/compare.mjs 맨 위.
name: 화면 촬영

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: 화면 촬영
    runs-on: ubuntu-latest
    env:
      SHOT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHOT_SHA }}
          fetch-depth: 0   # 갈라진 지점을 찾으려고 기록을 모두 받는다(저장소가 작아서 몇 초)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 후 — 화면 14장 찍기 (어두움 7 · 밝음 7)
        run: node .github/shots/shoot.mjs
        env:
          SHOT_LABEL: 후
      - name: 전 정하기 (main과 갈라진 지점)
        id: base
        if: always()
        run: |
          base=$(git merge-base "${BASE_SHA:-origin/main}" "$SHOT_SHA")
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "전: $base · 후: $SHOT_SHA"
          if [ "$base" != "$SHOT_SHA" ]; then
            git worktree add --detach "$RUNNER_TEMP/before" "$base"
            echo "shoot=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: 전 — 같은 화면 14장 찍기 (이 PR의 촬영 코드로)
        if: always() && steps.base.outputs.shoot == 'yes'   # 전과 후가 같은 커밋(main을 손으로 실행)이면 찍지 않는다
        continue-on-error: true   # 전(main 쪽)이 못 찍혀도 이 PR 탓이 아니다. 비교는 찍힌 그림끼리만
        working-directory: ${{ runner.temp }}/before
        run: node "$GITHUB_WORKSPACE/.github/shots/shoot.mjs"
        env:
          SHOT_OUT: ${{ github.workspace }}/_shots/before
          SHOT_SHA: ${{ steps.base.outputs.sha }}
          SHOT_LABEL: 전
      - name: 전후 비교
        if: always()
        run: node .github/shots/compare.mjs
        env:
          COMPARE_BASE: ${{ steps.base.outputs.sha }}
      - name: 내려받을 이름 정하기
        id: name
        if: always()
        run: echo "name=screens-${SHOT_SHA::7}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ steps.name.outputs.name }}
          path: _shots/
          if-no-files-found: warn
